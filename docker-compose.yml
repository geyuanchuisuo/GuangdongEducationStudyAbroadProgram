# 一体化部署：项目核心服务 + Dify（AI 平台）
# 先复制根目录 .env.example 为 .env，再复制 dify/docker/.env.example 为 dify/docker/.env。
# 根 .env 启用 Dify 默认 PostgreSQL/Weaviate profile；Dify 凭据在子目录 .env 配置。
# 启动后 dify-init 自动完成：创建管理员 → 添加模型供应商 → 导入应用 → 绑定模型 → 写入 app key 共享卷
include:
  - path: dify/docker/docker-compose.yaml

services:
  mysql:
    image: mysql:8.0
    container_name: edu-mysql
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in root .env}"
      MYSQL_DATABASE: GuangdongEducationStudyAbroadProgram
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    ports:
      - "59000:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: edu-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: edu-backend
    environment:
      DATABASE_URL: "mysql+aiomysql://root:${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in root .env}@mysql:3306/GuangdongEducationStudyAbroadProgram"
      REDIS_URL: redis://redis:6379
      # 文件存储：一期本地磁盘（零外部镜像依赖）；二期切 s3 时改 STORAGE_BACKEND=s3 并启用 MinIO
      STORAGE_BACKEND: local
      STORAGE_LOCAL_DIR: /app/storage_data
      # Dify 已纳入一体化部署，通过 service 名 dify_nginx 访问（Dify 控制台端口 8081）
      # 支持项目根 .env 覆盖；默认值用于同 compose 网络内的一体化部署。
      DIFY_BASE_URL: ${DIFY_BASE_URL:-http://dify_nginx}
      # M5 智能报告数据来源：mock=模拟数据（演示）/ production=真实业务表取数。
      # 业务侧确认 M5 字段映射后切 production（投诉周报因 9 字段未落库会按设计拒绝生成）。
      REPORT_DATA_SOURCE: ${REPORT_DATA_SOURCE:-production}
      # 知识库混合检索：Milvus/Ollama 在宿主机运行，容器内走 host.docker.internal
      # （config.py 默认 127.0.0.1 在容器内指向自身，连不上宿主机服务）
      MILVUS_URI: ${MILVUS_URI:-http://host.docker.internal:19530}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      # 长期挂载场景：Dify 初始化必须成功，backend 才启动
      dify-init:
        condition: service_completed_successfully
    volumes:
      - ./backend:/app
      # 独立命名卷保护镜像内构建好的 Linux venv，避免被宿主机 Windows venv 遮蔽
      - backend_venv:/app/.venv
      # 本地上传文件持久化（容器重建不丢）
      - backend_storage:/app/storage_data
      # 与 dify-init 共享 Agent keys；backend 只读加载
      - dify_app_keys:/run/dify-keys:ro
    # --reload-dir app：仅监听 backend/app，避免跑 tests/scripts 写入触发重启，产生约 1 秒的瞬时 500 窗口
    # uv sync：venv 与 uv.lock 幂等对齐——backend_venv 卷是历史快照，pyproject 新增依赖后卷不会自动更新
    # （v6.11.58 文件研判解析库缺失教训），每次启动对齐一次；已装包秒级跳过，失败不阻断启动
    # seed_all：空库自动注入种子数据（已有数据不动；清库重建手动跑 python -m scripts.seed_all --force），
    # v6.11.39——「重新拉起即有演示数据」，注入失败不阻断后端启动（打印警告继续）
    command: >-
      sh -c 'set -a && . /run/dify-keys/app_keys.env && set +a &&
      uv sync --frozen --no-dev || echo "[uv-sync] 依赖对齐失败（可能离线），沿用现有 venv";
      /app/.venv/bin/python -m scripts.seed_all || echo "[seed-all] 自动注入未成功（详见上方输出），后端继续启动";
      exec /app/.venv/bin/uvicorn app.main:app --reload --reload-dir app --host 0.0.0.0 --port 8000'

  # Dify 一键初始化：创建管理员 → 配模型供应商 → 导入应用 → 绑模型 → 写入 app key 共享卷
  # 长期挂载场景：必须成功，否则 backend 不启动
  dify-init:
    build:
      context: ./dify/docker
      dockerfile: Dockerfile.init
    container_name: edu-dify-init
    # 从 dify/docker/.env 加载模型/管理员配置（客户只需改这一个文件）
    env_file:
      - ./dify/docker/.env
    environment:
      # dify-init 专用变量（不依赖客户配置）
      DIFY_API_URL: http://api:5001
      DIFY_APPS_DIR: /apps
      DIFY_APP_KEYS_FILE: /shared/app_keys.env
    volumes:
      - ./dify/apps:/apps:ro
      - dify_app_keys:/shared
      # 脚本直接挂载仓库最新版：镜像陈旧也不会跑旧逻辑（LOG-094 中文 key 格式教训，LOG-096）
      - ./dify/docker/dify_init.py:/app/dify_init.py:ro
    depends_on:
      api:
        condition: service_healthy
    restart: "no"

  nginx:
    image: nginx:alpine
    container_name: edu-nginx
    # 80 端口被本机 Dify 占用，改用 8080
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data:
  backend_venv:
  backend_storage:
  dify_app_keys:
