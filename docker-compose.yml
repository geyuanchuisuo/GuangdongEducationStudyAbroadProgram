# 一体化部署：项目核心服务 + Dify（AI 平台）
# Dify 配置见 dify/docker/.env，模型 API Key 需在 Dify 控制台手动配置
include:
  - path: dify/docker/docker-compose.yaml

services:
  mysql:
    image: mysql:8.0
    container_name: edu-mysql
    environment:
      MYSQL_ROOT_PASSWORD: "420821"
      MYSQL_DATABASE: GuangdongEducationStudyAbroadProgram
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    ports:
      - "59000:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: edu-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: edu-backend
    environment:
      DATABASE_URL: mysql+aiomysql://root:420821@mysql:3306/GuangdongEducationStudyAbroadProgram
      REDIS_URL: redis://redis:6379
      # 文件存储：一期本地磁盘（零外部镜像依赖）；二期切 s3 时改 STORAGE_BACKEND=s3 并启用 MinIO
      STORAGE_BACKEND: local
      STORAGE_LOCAL_DIR: /app/storage_data
      # Dify 已纳入一体化部署，通过 service 名 dify_nginx 访问（Dify 控制台端口 8081）
      DIFY_BASE_URL: http://dify_nginx
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      # 独立命名卷保护镜像内构建好的 Linux venv，避免被宿主机 Windows venv 遮蔽
      - backend_venv:/app/.venv
      # 本地上传文件持久化（容器重建不丢）
      - backend_storage:/app/storage_data
    command: /app/.venv/bin/uvicorn app.main:app --reload --host 0.0.0.0 --port 8000

  nginx:
    image: nginx:alpine
    container_name: edu-nginx
    # 80 端口被本机 Dify 占用，改用 8080
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data:
  backend_venv:
  backend_storage:
