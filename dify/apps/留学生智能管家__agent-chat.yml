# 留学生智能管家 Agent 应用配置（v6.11.4 骨架，v6.11.14 对齐 Dify 1.16 DSL 0.5.0 model_config 结构）
# 导入说明：
#   1. dify-init 自动导入（推荐）；或 Dify 控制台「创建应用 → 导入 DSL」选此文件
#   2. your-model-name / your-model-provider 为占位符，由 dify-init 导入时注入 dify/docker/.env 的客户模型配置
#   3. 建议挂载知识库《留学生生活FAQ》《学业考务指南》
#   4. 后端会通过 inputs.restrictions 注入硬性限制（不承诺退费、不给医疗级建议），见 backend/app/services/student_service.py STUDENT_CAPABILITIES
app:
  description: 粤教留学学生端智能助手，行政服务代办、心理关怀、学业提醒、主动推送
  icon: 🎓
  icon_background: '#E8F3FF'
  mode: chat
  name: 留学生智能管家
  use_icon_as_answer_icon: true
kind: app
model_config:
  agent_mode:
    enabled: false
    prompt: null
    strategy: null
    tools: []
  annotation_reply:
    enabled: false
  chat_prompt_config: {}
  completion_prompt_config: {}
  dataset_configs:
    retrieval_model: multiple
  dataset_query_variable: null
  external_data_tools: []
  file_upload:
    image:
      detail: high
      enabled: false
      number_limits: 3
      transfer_methods:
      - remote_url
      - local_file
  model:
    completion_params:
      temperature: 0.8
      max_tokens: 4096
      top_p: 1
    mode: chat
    name: your-model-name
    provider: your-model-provider
  more_like_this:
    enabled: false
  opening_statement: 你好呀，我是你的留学生智能管家。请假、查成绩、生活疑问、想找人聊聊，都可以跟我说。
  pre_prompt: |
    你是粤教留学的「留学生智能管家」，服务对象是公司的留学生。

    核心人设：
    - 温和、耐心、有同理心，像学长学姐一样陪伴留学生海外生活
    - 支持行政服务代办（请假、证明开具）、心理关怀倾听、学业考务提醒、进度查询、生活 FAQ

    ⚠️ 硬性限制（必须遵守，由后端 inputs.restrictions 同步注入）：
    - 不承诺任何退费、赔付、赔偿事项——涉及费用一律回复「费用相关请联系你的负责老师或招生老师」
    - 不给出医疗级建议——身体不适一律建议「尽快就医或联系校医，我不能代替医生诊断」
    - 情绪问题（抑郁、自伤倾向）必须引导「请联系负责老师或专业心理援助热线」，不得自行处置

    后端会在 inputs.capabilities 中注入当前学生可使用的服务能力清单。
  prompt_type: simple
  retriever_resource:
    enabled: true
  sensitive_word_avoidance:
    configs: []
    enabled: false
    type: ''
  speech_to_text:
    enabled: false
  suggested_questions:
  - 我想请假
  - 最近有什么考试？
  - 我的申请进度到哪了？
  suggested_questions_after_answer:
    enabled: false
  text_to_speech:
    enabled: false
  user_input_form: []
version: 0.5.0
