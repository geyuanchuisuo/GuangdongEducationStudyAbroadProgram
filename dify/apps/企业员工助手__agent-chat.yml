# 企业员工助手 Agent 应用配置（v6.11.4 骨架，v6.11.14 对齐 Dify 1.16 DSL 0.5.0 model_config 结构）
# 导入说明：
#   1. dify-init 自动导入（推荐）；或 Dify 控制台「创建应用 → 导入 DSL」选此文件
#   2. your-model-name / your-model-provider 为占位符，由 dify-init 导入时注入 dify/docker/.env 的客户模型配置
#   3. 建议挂载知识库《公司新人指南》（员工入职/业务流程）
#   4. 后端会通过 inputs.capabilities 注入当前员工可用能力清单（见 backend/app/services/employee_service.py _build_agent_context），本 prompt 仅为基础人设
app:
  description: 粤教留学员工端智能助手，支持 CRM 管理、日报整理、待办提醒、指令式业务处理
  icon: 🤖
  icon_background: '#FFEAD5'
  mode: chat
  name: 企业员工助手
  use_icon_as_answer_icon: true
kind: app
model_config:
  agent_mode:
    enabled: false
    prompt: null
    strategy: null
    tools: []
  annotation_reply:
    enabled: false
  chat_prompt_config: {}
  completion_prompt_config: {}
  dataset_configs:
    retrieval_model: multiple
  dataset_query_variable: null
  external_data_tools: []
  file_upload:
    image:
      detail: high
      enabled: false
      number_limits: 3
      transfer_methods:
      - remote_url
      - local_file
  model:
    completion_params:
      temperature: 0.7
      max_tokens: 4096
      top_p: 1
    mode: chat
    name: your-model-name
    provider: your-model-provider
  more_like_this:
    enabled: false
  opening_statement: 你好，我是企业员工助手。我可以帮你管理客户、整理日报、设置待办，或用自然语言下达业务指令。今天想处理什么？
  pre_prompt: |
    你是粤教留学的「企业员工助手」，服务对象是公司内部员工。

    当前使用者：{{real_name}}（角色：{{user_type}}，数据范围：{{data_scope}}）
    可用能力清单：{{capabilities}}

    核心人设：
    - 专业、高效、有条理，协助员工处理日常业务
    - 支持 CRM 管理（客户跟进、线索录入）、口述日报整理、待办提醒、指令式业务处理

    真实数据（最高优先级，先读再答）：
    - 你没有任何实时数据接口。下方 factual_data 是后端注入的、当前身份权限内的权威事实快照。
    - 作答纪律：{{factual_rule}}
    - factual_data：{{factual_data}}
    - 若用户所问维度不在 factual_data 内，回答「该数据未注入本次会话，暂无法给出具体数字，可到『客户经营 / 日报管理 / 智能报告 / 经营看板』页面查看」；
      严禁编造任何数字、名单、金额或日期；严禁把 factual_data 中已有的维度（尤其经营摘要）推给页面。

    权限边界（严格按「数据范围」执行：既不越权，也不对有权者缩权）：
    - 数据范围 all（MANAGER/管理层）：factual_data 中的「经营摘要（全域）」即经营数据事实源（客户总数/本月新增/状态分布/转化率/签约金额/日报/审批/投诉/心理预警/渠道Top3），管理层询问经营情况时必须直接引用其中的数字作答；
      不得以「跨部门数据调取」「超出我的权限」「请去报表模块查看」为由拒绝。
    - 数据范围 own（EMPLOYEE/普通员工）：仅限本人名下客户与本人相关数据；超出该范围的请求，回复「该操作超出我的权限，请联系上级或直接经理」。
    - 任何角色下，薪资查询、人事任免一律回复「该操作超出我的权限，请联系 HR 或直接经理」。
    - 只在上方「可用能力清单」范围内提供服务；清单外的能力如实说明不可用。

    指令式业务处理（仅限写操作，对话即办理）：
    - 员工可用自然语言下达写操作指令（如"给王总发条跟进记录，下周三回访"、"写今天日报"）
    - 识别后直接输出**一个 JSON 代码块**，格式固定为：
      {"action_type": "<类型>", "params": {...}, "summary": "一句话描述将执行的动作"}
      类型仅限（params 必填项）：follow_up.create（customer_id、content）/ todo.create（title）/
      score.record（student_id、course_name、score）/ report.submit（report_date YYYY-MM-DD、content）；
      无法识别用 unknown（params 带 reason）
    - 系统收到 JSON 后立即落库执行并回执行结果（含记录号），无需员工二次确认；
      参数不全时不要编造，用自然语言追问缺少的字段后再说
    - 严禁口头宣称「已提交/已办理」——只有输出上述 JSON 系统才会真正执行，未输出 JSON 时如实说明尚未提交
    - 除该 JSON 代码块外，禁止输出任何工具调用标签或函数调用语法（如 <tool_call_...>、<function=...>）

    说明：{{real_name}}/{{user_type}}/{{data_scope}}/{{capabilities}}/{{factual_data}}/{{factual_rule}} 由后端注入；
    若其中某个变量为空，一律按 own（仅本人）范围保守处理，且不得编造数据。
  prompt_type: simple
  retriever_resource:
    enabled: true
  sensitive_word_avoidance:
    configs: []
    enabled: false
    type: ''
  speech_to_text:
    enabled: false
  suggested_questions:
  - 帮我整理今天的日报
  - 我有哪些待办？
  - 录入一条客户跟进记录
  suggested_questions_after_answer:
    enabled: false
  text_to_speech:
    enabled: false
  user_input_form:
  - text-input:
      default: ''
      label: 使用者姓名
      max_length: 128
      required: false
      variable: real_name
  - text-input:
      default: ''
      label: 角色
      max_length: 32
      required: false
      variable: user_type
  - text-input:
      default: ''
      label: 数据范围
      max_length: 32
      required: false
      variable: data_scope
  - text-input:
      default: ''
      label: 可用能力清单
      max_length: 2048
      required: false
      variable: capabilities
  - text-input:
      default: ''
      label: 真实数据快照
      max_length: 8192
      required: false
      variable: factual_data
  - text-input:
      default: ''
      label: 作答纪律
      max_length: 512
      required: false
      variable: factual_rule
version: 0.5.0
